# Default level: show INFO and above in production
# Override per-package for finer control during development
org.slf4j.simpleLogger.defaultLogLevel=info

# Show DEBUG for server code while developing locally
org.slf4j.simpleLogger.log.Server=debug

# Silence noisy third-party libraries
org.slf4j.simpleLogger.log.com.zaxxer.hikari=warn
org.slf4j.simpleLogger.log.org.java_websocket=warn

# Include timestamps and log level in every line
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.showThreadName=false
