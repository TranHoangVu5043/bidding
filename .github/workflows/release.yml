name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            installer-type: exe
            artifact-name: BiddingAuction-windows.exe
          - os: macos-latest
            installer-type: dmg
            artifact-name: BiddingAuction-macos.dmg
          - os: ubuntu-latest
            installer-type: deb
            artifact-name: BiddingAuction-linux.deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install GTK libs (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libgl1-mesa-dri

      - name: Build JAR
        run: mvn -pl client package -DskipTests --no-transfer-progress

      - name: Copy dependencies to input folder
        shell: bash
        run: |
          mkdir -p app-input
          cp client/target/bidding-client-1.0.jar app-input/
          mvn -pl client dependency:copy-dependencies \
            -DoutputDirectory=app-input \
            -DincludeScope=runtime \
            --no-transfer-progress

      - name: Package with jpackage
        shell: bash
        run: |
          jpackage \
            --type ${{ matrix.installer-type }} \
            --input app-input \
            --main-jar bidding-client-1.0.jar \
            --main-class Client.ClientApp \
            --name BiddingAuction \
            --app-version 1.0.0 \
            --dest installer-output \
            --java-options "-Dfile.encoding=UTF-8 --add-modules javafx.controls,javafx.fxml,javafx.graphics"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
