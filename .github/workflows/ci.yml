name: CI — Build & Test

on:
  push:
    branches: [ production, main ]
  pull_request:
    branches: [ production, main ]

jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install GTK libs (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libgl1-mesa-glx

      - name: Build & run server tests
        run: mvn -pl server test --no-transfer-progress

      - name: Build client (skip GUI tests)
        run: mvn -pl client compile --no-transfer-progress
